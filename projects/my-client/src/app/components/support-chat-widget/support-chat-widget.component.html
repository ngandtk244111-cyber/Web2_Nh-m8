<!-- Floating trigger button -->
<button
  *ngIf="!chatService.isOpen()"
  (click)="toggle()"
  type="button"
  class="scw_fab"
  aria-label="Mở khung chat hỗ trợ">
  <app-icon name="message" [size]="24"></app-icon>
</button>

<!-- Chat panel -->
<section *ngIf="chatService.isOpen()" class="scw" role="dialog" aria-label="Chat hỗ trợ trực tuyến Luméa">

  <header class="scw_head">
    <div class="scw_avatar">
      <app-icon name="message" [size]="18"></app-icon>
      <span class="scw_presence" [class.scw_presence--on]="chatService.staffOnline()" aria-hidden="true"></span>
    </div>
    <div class="scw_who">
      <h3 class="scw_name">Hỗ Trợ Trực Tuyến Luméa</h3>
      <p class="scw_status">
        <span class="scw_dot" [class.scw_dot--on]="chatService.staffOnline()"></span>
        <ng-container *ngIf="chatService.staffTyping(); else statusText">Nhân viên đang soạn tin...</ng-container>
        <ng-template #statusText>{{ chatService.staffOnline() ? 'Nhân viên đang trực tuyến' : 'Ngoại tuyến · sẽ phản hồi sớm nhất' }}</ng-template>
      </p>
    </div>
    <button type="button" (click)="toggle()" class="scw_close" aria-label="Đóng">
      <app-icon name="x" [size]="18"></app-icon>
    </button>
  </header>

  <div class="scw_body" #body>
    <div *ngIf="chatService.messages().length === 0" class="scw_empty">
      Chào bạn! Nhắn tin để được đội ngũ Luméa hỗ trợ trực tiếp.
    </div>

    <div
      *ngFor="let msg of chatService.messages()"
      class="scw_msg"
      [class.scw_msg--me]="msg.sender === 'customer'">
      {{ msg.text }}
    </div>

    <!-- Nhân viên đang gõ -->
    <div *ngIf="chatService.staffTyping()" class="scw_msg scw_typing" aria-label="Nhân viên đang soạn tin">
      <span></span><span></span><span></span>
    </div>
  </div>

  <form (ngSubmit)="send()" class="scw_input">
    <input
      type="text"
      [(ngModel)]="draft"
      (ngModelChange)="onDraftChange()"
      name="draft"
      autocomplete="off"
      placeholder="Nhập tin nhắn...">
    <button type="submit" class="scw_send" [disabled]="!draft.trim()" aria-label="Gửi">
      <app-icon name="send" [size]="16"></app-icon>
    </button>
  </form>
</section>
