<div
  class="vcard"
  [class.vcard--selectable]="selectable"
  [class.vcard--selected]="selected"
  [class.vcard--off]="!usable || !!disabledReason"
  [attr.role]="selectable ? 'button' : null"
  [attr.tabindex]="selectable ? 0 : null"
  [attr.aria-pressed]="selectable ? selected : null"
  (click)="onClick()"
  (keydown.enter)="onClick()">
  <div class="vcard__stub">
    <app-icon name="tag" [size]="20"></app-icon>
    <span>Luméa</span>
  </div>
  <div class="vcard__body">
    <strong class="vcard__title">{{ voucher.title }}</strong>
    <span class="vcard__desc">{{ voucher.description }}</span>
    <span class="vcard__meta">
      <span class="vcard__code">{{ voucher.code }}</span>
      <span>· HSD {{ voucher.expiresAt | date: 'dd/MM/yyyy' }}</span>
    </span>
    <span class="vcard__warn" *ngIf="disabledReason && usable">
      <app-icon name="lock" [size]="12"></app-icon>{{ disabledReason }}
    </span>
  </div>
  <div class="vcard__side">
    <span class="vcard__status" *ngIf="statusLabel as s; else actions">{{ s }}</span>
    <ng-template #actions>
      <ng-container *ngIf="selectable; else copyBtn">
        <span *ngIf="!disabledReason" class="vcard__radio" [class.vcard__radio--on]="selected" aria-hidden="true">
          <app-icon *ngIf="selected" name="check" [size]="12"></app-icon>
        </span>
      </ng-container>
      <!-- Mã của shop: "Lưu mã" vào ví; voucher cá nhân đã nằm sẵn trong ví -> "Dùng ngay" mở giỏ hàng -->
      <ng-template #copyBtn>
        <ng-container *ngIf="isShopCode; else ownBtn">
          <button *ngIf="!saved; else savedTag" type="button" class="vcard__copy" (click)="save($event)">Lưu mã</button>
          <ng-template #savedTag>
            <span class="vcard__saved"><app-icon name="check" [size]="12"></app-icon>Đã lưu</span>
          </ng-template>
        </ng-container>
        <ng-template #ownBtn>
          <button type="button" class="vcard__copy" (click)="useNow($event)">Dùng ngay</button>
        </ng-template>
      </ng-template>
    </ng-template>
  </div>
</div>
