<div class="login-wrapper">
  <div class="login-container">
    <!-- Trái: thương hiệu & minh hoạ -->
    <div class="left-panel">
      <img src="logo/lumea-logo.png" alt="Luméa" class="brand-logo">
      <div class="illustration-box">
        <img src="login/lumea-interior.webp" alt="Phòng khách nội thất Luméa" class="illustration-main">
      </div>
      <p class="brand-caption">Trang quản trị Luméa — nội thất tối giản & decor in 3D</p>
    </div>

    <!-- Phải: thẻ đăng nhập -->
    <div class="right-panel">
      <div class="login-card">
        <h2 class="form-title">Đăng nhập</h2>
        <p class="form-sub">Dành cho nhân viên Luméa</p>

        <div class="alert-error" *ngIf="error" role="alert">
          <i class="bi bi-exclamation-circle"></i> {{ error }}
        </div>

        <form (ngSubmit)="submit()" novalidate>
          <div class="form-group">
            <label for="username">Tên đăng nhập<span class="required">*</span></label>
            <div class="input-icon">
              <i class="bi bi-person"></i>
              <input id="username" name="username" type="text" class="form-control" autocomplete="username"
                placeholder="Nhập tên đăng nhập" [(ngModel)]="username" (input)="error = ''" autofocus>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu<span class="required">*</span></label>
            <div class="input-icon">
              <i class="bi bi-lock"></i>
              <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" class="form-control"
                autocomplete="current-password" placeholder="Nhập mật khẩu" [(ngModel)]="password" (input)="error = ''">
              <button type="button" class="toggle-btn" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
          </div>

          <p class="hint-text"><i class="bi bi-info-circle"></i> Quên mật khẩu? Liên hệ Super Admin để được cấp lại.</p>

          <button type="submit" class="submit-btn" [disabled]="submitting">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            {{ submitting ? 'Đang đăng nhập…' : 'Đăng nhập' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
