    <div
      class="pc group relative flex h-full min-w-0"
      [class.flex-col]="layout === 'grid'"
      [class.flex-row]="layout === 'list'"
      [class.gap-4]="layout === 'list'">

      <!-- Image -->
      <div
        class="pc__img relative overflow-hidden aspect-square flex items-end justify-center pt-2 px-2 pb-0"
        [ngClass]="layout === 'grid' ? 'w-full' : 'w-36 flex-shrink-0'">
        <!-- Ảnh 1 (mặc định) -> ảnh 2 khi rê chuột vào thẻ:
             Frameless Editorial Style: object-contain object-bottom căn đáy như đặt trên kệ, hòa vào nền trang -->
        <a
          [routerLink]="['/product', product.slug]"
          [attr.aria-label]="product.name"
          class="absolute inset-0 flex items-end justify-center pt-2 px-2 pb-0">
          <img
            [src]="product.images[0]"
            [alt]="product.name"
            loading="lazy"
            decoding="async"
            draggable="false"
            class="w-full h-full object-contain object-bottom transition-[transform,opacity] duration-500 ease-out group-hover:scale-105"
            [ngClass]="product.images[1] ? 'group-hover:opacity-0' : ''">
          <img
            *ngIf="product.images[1]"
            [src]="product.images[1]"
            alt=""
            aria-hidden="true"
            loading="lazy"
            decoding="async"
            draggable="false"
            class="pc__img-alt absolute inset-0 w-full h-full pt-2 px-2 pb-0 object-contain object-bottom opacity-0 transition-[transform,opacity] duration-500 ease-out group-hover:scale-105 group-hover:opacity-100">
        </a>

        <!-- Badges: Sale / 3D -->
        <div class="absolute top-2.5 left-2.5 z-20 flex flex-col gap-1 items-start">
          <span *ngIf="discountPercent > 0" class="pc__tag pc__tag--sale">-{{ discountPercent }}%</span>
          <span *ngIf="has3D" class="pc__tag pc__tag--dark" title="Có mô hình 3D xem trực tiếp">
            <app-icon name="cube" [size]="11"></app-icon>
            <span>3D</span>
          </span>
        </div>

        <!-- Favorite -->
        <button
          type="button"
          (click)="toggleFavorite($event)"
          class="pc__fav absolute top-2.5 right-2.5 z-20 w-8 h-8 rounded-full flex items-center justify-center transition hover:scale-110"
          [class.text-neutral-700]="!favoriteService.isFavorite(product.id)"
          [class.text-rose-500]="favoriteService.isFavorite(product.id)"
          [attr.aria-label]="favoriteService.isFavorite(product.id) ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'"
          [attr.aria-pressed]="favoriteService.isFavorite(product.id)">
          <app-icon
            name="heart"
            [size]="16"
            [filled]="favoriteService.isFavorite(product.id)">
          </app-icon>
        </button>

        <!-- Hover actions -->
        <div class="pc__actions absolute inset-x-0 bottom-0 z-20 p-2.5 flex items-center justify-center gap-2 flex-wrap">
          <a
            *ngIf="has3D"
            [routerLink]="['/phong-3d', product.id]"
            target="_blank"
            rel="noopener"
            class="pc__btn">
            <app-icon name="cube" [size]="13"></app-icon>
            <span>Xem 3D</span>
          </a>
          <button type="button" (click)="openQuickView()" class="pc__btn">
            <app-icon name="eye" [size]="13"></app-icon>
            <span>Xem nhanh</span>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div
        class="pc__body flex-1 flex flex-col min-w-0"
        [ngClass]="layout === 'grid' ? 'px-0 pt-3 pb-2' : 'py-1 pr-0 pl-0'">
        <div class="flex items-center justify-between gap-2 pc__meta">
          <span class="pc__cat truncate">{{ categoryLabel }}</span>
          <span class="pc-rating flex items-center gap-1 flex-shrink-0">
            <app-icon name="star" [size]="11" [filled]="true"></app-icon>
            <span>{{ product.rating }}</span>
            <span class="pc__count">({{ product.reviewCount }})</span>
          </span>
        </div>

        <h3 class="pc__name line-clamp-2">
          <a [routerLink]="['/product', product.slug]">{{ product.name }}</a>
        </h3>

        <p class="pc__dim line-clamp-1">{{ product.dimensions }}</p>

        <div class="pc__foot mt-auto flex items-end justify-between gap-2">
          <div class="flex items-baseline flex-wrap gap-x-2">
            <span class="pc__price">{{ price | vnd }}</span>
            <span *ngIf="discountPercent > 0" class="pc__old">{{ product.originalPrice | vnd }}</span>
          </div>

          <button
            *ngIf="!product.customizable"
            type="button"
            (click)="openQuickView()"
            class="pc__cart"
            title="Thêm vào giỏ hàng"
            aria-label="Thêm vào giỏ hàng">
            <app-icon name="cart" [size]="16"></app-icon>
          </button>
        </div>
      </div>

    </div>
