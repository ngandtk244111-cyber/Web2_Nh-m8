<div class="fcw">
  <button type="button" class="fcw__btn" aria-label="Xem Xu Luméa" (click)="toggle()">
    <svg viewBox="0 0 100 110" class="fcw__bag" aria-hidden="true">
      <defs>
        <linearGradient id="fcw-red" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F0505A"/>
          <stop offset="1" stop-color="#C22A36"/>
        </linearGradient>
        <linearGradient id="fcw-gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFE27A"/>
          <stop offset="1" stop-color="#EBAA2C"/>
        </linearGradient>
        <g id="fcw-c">
          <circle r="6" fill="url(#fcw-gold)" stroke="#D08A1E" stroke-width="1"/>
          <circle r="4.2" fill="none" stroke="#FFF1B0" stroke-width="0.8"/>
          <path d="M-3.2 -1.6A3.6 3.6 0 0 1 0.6 -3.6" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
        </g>
        <path id="fcw-star" d="M0-5 1.5-1.5 5 0 1.5 1.5 0 5-1.5 1.5-5 0-1.5-1.5z"/>
      </defs>

      <!-- xu trong miệng túi -->
      <use href="#fcw-c" transform="translate(36 50) scale(1.55)"/>
      <use href="#fcw-c" transform="translate(66 51) scale(1.5)"/>
      <use href="#fcw-c" transform="translate(51 46) scale(1.75)"/>
      <text x="51" y="49" text-anchor="middle" font-size="7" font-weight="800" fill="#A56A0E">Xu</text>

      <!-- thân túi -->
      <path d="M22 62C14 72 9 88 15 98C21 108 79 108 85 98C91 88 86 72 78 62Z" fill="url(#fcw-red)"/>
      <path d="M15 98C21 108 79 108 85 98C87 94 88 90 87.5 86C80 100 30 104 15 92Z" fill="#A81F2B" opacity="0.45"/>
      <ellipse cx="27" cy="82" rx="2.8" ry="8" fill="#ffffff" opacity="0.45" transform="rotate(8 27 82)"/>
      <circle cx="29" cy="94" r="1.8" fill="#ffffff" opacity="0.45"/>

      <!-- miệng túi nhún nếp -->
      <path d="M21 63Q18 52 25 48Q31 53 37 48Q43 54 50 48Q57 54 63 48Q69 53 75 48Q82 52 79 63Z" fill="#CF3440"/>
      <path d="M29 51 31 62M40 52 41 63M52 52 51 63M63 52 62 63M72 51 71 62" stroke="#A81F2B" stroke-width="1.3" stroke-linecap="round" fill="none"/>

      <!-- dây buộc vàng + nơ -->
      <path d="M21 64Q50 72 79 63" fill="none" stroke="#F6C244" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M74 64C70 56 80 54 83 60C84 65 77 67 74 64Z" fill="none" stroke="#F6C244" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M77 66 84 71M75 66 77 72" fill="none" stroke="#F6C244" stroke-width="2.2" stroke-linecap="round"/>

      <!-- xu tung lên -->
      <g class="fcw__toss" style="--dx:-20px;--dy:-40px;animation-delay:0s">
        <g class="fcw__spin" style="animation-delay:0s"><use href="#fcw-c" transform="translate(50 44) scale(0.95)"/></g>
      </g>
      <g class="fcw__toss" style="--dx:16px;--dy:-46px;animation-delay:0.55s">
        <g class="fcw__spin" style="animation-delay:0.2s"><use href="#fcw-c" transform="translate(50 44) scale(0.85)"/></g>
      </g>
      <g class="fcw__toss" style="--dx:-4px;--dy:-52px;animation-delay:1.15s">
        <g class="fcw__spin" style="animation-delay:0.4s"><use href="#fcw-c" transform="translate(50 44) scale(0.75)"/></g>
      </g>
      <g class="fcw__toss" style="--dx:27px;--dy:-30px;animation-delay:1.8s">
        <g class="fcw__spin" style="animation-delay:0.1s"><use href="#fcw-c" transform="translate(50 44) scale(0.8)"/></g>
      </g>

      <!-- sao lấp lánh -->
      <g transform="translate(16 44)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0s" fill="#FFE27A"/></g>
      <g transform="translate(86 38)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0.5s" fill="#ffffff"/></g>
      <g transform="translate(30 14)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:1.1s" fill="#ffffff"/></g>
      <g transform="translate(72 12)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0.8s" fill="#FFE27A"/></g>
      <g transform="translate(50 6)"><use href="#fcw-star" class="fcw__spark fcw__spark--sm" style="animation-delay:1.4s" fill="#FFF1B0"/></g>
    </svg>
    <span class="fcw__badge">
      <app-icon name="coin" [size]="10"></app-icon>
      <span>{{ authService.currentUser() ? coinService.balance() : 0 }}</span>
    </span>
  </button>

  <div class="fcw__panel" *ngIf="panelOpen()" (click)="$event.stopPropagation()">
    <div class="fcw__panel-head">
      <span>Xu Luméa của bạn</span>
      <button type="button" class="fcw__panel-close" aria-label="Đóng" (click)="close()">
        <app-icon name="x" [size]="13"></app-icon>
      </button>
    </div>
    <div class="fcw__panel-balance">
      <app-icon name="coin" [size]="20"></app-icon>
      <span>{{ coinService.balance() }} xu</span>
    </div>
    <p class="fcw__panel-hint">Dùng Xu để giảm trực tiếp vào đơn hàng khi thanh toán.</p>
    <a routerLink="/account" [queryParams]="{ tab: 'coins' }" (click)="close()" class="fcw__panel-link">
      Xem lịch sử &amp; cách nhận thêm xu →
    </a>
  </div>
</div>
