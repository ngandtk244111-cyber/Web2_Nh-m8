    <svg 
      [attr.width]="size" 
      [attr.height]="size" 
      viewBox="0 0 24 24" 
      fill="none" 
      stroke="currentColor" 
      [attr.stroke-width]="strokeWidth" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      [class]="class">
      
      <!-- Cart -->
      <ng-container *ngIf="name === 'cart'">
        <circle cx="8" cy="21" r="1"/>
        <circle cx="19" cy="21" r="1"/>
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
      </ng-container>

      <!-- Sparkles / AI -->
      <ng-container *ngIf="name === 'sparkles'">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
        <path d="M19 3v4"/>
        <path d="M21 5h-4"/>
      </ng-container>

      <!-- Box / 3D Cube -->
      <ng-container *ngIf="name === 'box' || name === 'cube'">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </ng-container>

      <!-- Search -->
      <ng-container *ngIf="name === 'search'">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </ng-container>

      <!-- Heart -->
      <ng-container *ngIf="name === 'heart'">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </ng-container>

      <!-- Message -->
      <ng-container *ngIf="name === 'message'">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
      </ng-container>

      <!-- Room / Home -->
      <ng-container *ngIf="name === 'home' || name === 'room'">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </ng-container>

      <!-- Sliders / Customize -->
      <ng-container *ngIf="name === 'sliders'">
        <line x1="4" x2="4" y1="21" y2="14"/>
        <line x1="4" x2="4" y1="10" y2="3"/>
        <line x1="12" x2="12" y1="21" y2="12"/>
        <line x1="12" x2="12" y1="8" y2="3"/>
        <line x1="20" x2="20" y1="21" y2="16"/>
        <line x1="20" x2="20" y1="12" y2="3"/>
        <line x1="1" x2="7" y1="14" y2="14"/>
        <line x1="9" x2="15" y1="8" y2="8"/>
        <line x1="17" x2="23" y1="16" y2="16"/>
      </ng-container>

      <!-- Eye / Preview -->
      <ng-container *ngIf="name === 'eye'">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </ng-container>

      <!-- Tag -->
      <ng-container *ngIf="name === 'tag'">
        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/>
        <path d="M7 7h.01"/>
      </ng-container>

      <!-- Check -->
      <ng-container *ngIf="name === 'check'">
        <polyline points="20 6 9 17 4 12"/>
      </ng-container>

      <!-- Plus -->
      <ng-container *ngIf="name === 'plus'">
        <path d="M5 12h14"/>
        <path d="M12 5v14"/>
      </ng-container>

      <!-- Minus -->
      <ng-container *ngIf="name === 'minus'">
        <path d="M5 12h14"/>
      </ng-container>

      <!-- Trash -->
      <ng-container *ngIf="name === 'trash'">
        <path d="M3 6h18"/>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
      </ng-container>

      <!-- Close / X -->
      <ng-container *ngIf="name === 'x'">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </ng-container>

      <!-- Menu -->
      <ng-container *ngIf="name === 'menu'">
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </ng-container>

      <!-- Chevron Down -->
      <ng-container *ngIf="name === 'chevron-down'">
        <polyline points="6 9 12 15 18 9"/>
      </ng-container>

      <!-- Chevron Right -->
      <ng-container *ngIf="name === 'chevron-right'">
        <polyline points="9 18 15 12 9 6"/>
      </ng-container>

      <!-- Chevron Left -->
      <ng-container *ngIf="name === 'chevron-left'">
        <polyline points="15 18 9 12 15 6"/>
      </ng-container>

      <!-- Rotate 3D -->
      <ng-container *ngIf="name === 'rotate'">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </ng-container>

      <!-- Send -->
      <ng-container *ngIf="name === 'send'">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </ng-container>

      <!-- Star -->
      <ng-container *ngIf="name === 'star'">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </ng-container>

      <!-- Truck / Shipping -->
      <ng-container *ngIf="name === 'truck'">
        <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
        <path d="M15 18H9"/>
        <path d="M19 18h2a1 1 0 0 0 1-1v-5l-3-4h-5v10Z"/>
        <circle cx="7" cy="18" r="2"/>
        <circle cx="17" cy="18" r="2"/>
      </ng-container>

      <!-- User -->
      <ng-container *ngIf="name === 'user'">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </ng-container>

      <!-- Shield / Guarantee -->
      <ng-container *ngIf="name === 'shield'">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
      </ng-container>

      <!-- Coin / Reward -->
      <ng-container *ngIf="name === 'coin'">
        <circle cx="12" cy="12" r="9"/>
        <path d="M14.5 9.5a2.5 2 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2a2.5 2 0 0 1-2.5-1.5"/>
        <path d="M12 6.5v1"/>
        <path d="M12 16.5v1"/>
      </ng-container>

      <!-- Bell / Notifications -->
      <ng-container *ngIf="name === 'bell'">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </ng-container>

      <!-- Map Pin / Location -->
      <ng-container *ngIf="name === 'map-pin'">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
        <circle cx="12" cy="10" r="3"/>
      </ng-container>

      <!-- Eye Off / Hide password -->
      <ng-container *ngIf="name === 'eye-off'">
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        <path d="M2 2l20 20"/>
      </ng-container>

      <!-- Lock -->
      <ng-container *ngIf="name === 'lock'">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </ng-container>

      <!-- Cash / COD -->
      <ng-container *ngIf="name === 'cash'">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M6 6v0"/>
        <path d="M18 18v0"/>
      </ng-container>

      <!-- Bank / Chuyển khoản -->
      <ng-container *ngIf="name === 'bank'">
        <path d="M3 10 12 4l9 6"/>
        <path d="M5 10v9"/>
        <path d="M9 10v9"/>
        <path d="M15 10v9"/>
        <path d="M19 10v9"/>
        <path d="M3 21h18"/>
      </ng-container>

      <!-- Credit card -->
      <ng-container *ngIf="name === 'credit-card'">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M2 10h20"/>
        <path d="M6 15h4"/>
      </ng-container>

      <!-- QR code -->
      <ng-container *ngIf="name === 'qr-code'">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3z"/>
        <path d="M20 14h1v1"/>
        <path d="M14 20h1v1"/>
        <path d="M20 20h1v1"/>
      </ng-container>

      <!-- Facebook -->
      <ng-container *ngIf="name === 'facebook'">
        <path d="M15 3h-2a4 4 0 0 0-4 4v3H6v4h3v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
      </ng-container>

      <!-- Instagram -->
      <ng-container *ngIf="name === 'instagram'">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/>
      </ng-container>

      <!-- TikTok -->
      <ng-container *ngIf="name === 'tiktok'">
        <path d="M14 3v10.6a3.4 3.4 0 1 1-3-3.37"/>
        <path d="M14 3a5.4 5.4 0 0 0 5 5"/>
        <path d="M19 8v3a7.5 7.5 0 0 1-5-1.9"/>
      </ng-container>

      <!-- YouTube -->
      <ng-container *ngIf="name === 'youtube'">
        <rect x="2" y="6" width="20" height="12" rx="4"/>
        <path d="M10 9.5l6 2.5-6 2.5v-5z" fill="currentColor" stroke="none"/>
      </ng-container>
    </svg>
