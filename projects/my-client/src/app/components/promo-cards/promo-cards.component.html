<section class="pc_section">
  <div class="pc_grid">
    <a
      *ngFor="let card of cards; let i = index"
      [routerLink]="card.link"
      class="pc_card">
      <div class="pc_card__top">
        <span class="pc_card__index">{{ (i + 1).toString().padStart(2, '0') }}</span>
        <span class="pc_card__icon">
          <app-icon [name]="card.icon" [size]="20" [strokeWidth]="1.5"></app-icon>
        </span>
      </div>

      <div class="pc_card__title">{{ card.title }}</div>
      <div class="pc_card__subtitle">{{ card.subtitle }}</div>

      <span class="pc_card__more">
        <span>Khám phá</span>
        <span class="pc_card__arrow" aria-hidden="true">→</span>
      </span>
    </a>
  </div>
</section>
