    <div
      class="pc group relative flex h-full min-w-0"
      [class.flex-col]="layout === 'grid'"
      [class.flex-row]="layout === 'list'"
      [class.gap-4]="layout === 'list'">

      <!-- Image -->
      <div
        class="pc__img relative overflow-hidden"
        [class.w-full]="layout === 'grid'"
        [class.pc__img--grid]="layout === 'grid'"
        [class.w-36]="layout === 'list'"
        [class.aspect-square]="layout === 'list'"
        [class.flex-shrink-0]="layout === 'list'">
        <!-- Ảnh 1: ảnh studio (mặc định). Ảnh 2: ảnh lifestyle, crossfade khi hover; không có ảnh 2 thì giữ ảnh 1. -->
        <img
          #cardImg
          [src]="product.images[0]"
          [alt]="product.name"
          class="pc__photo absolute inset-0 w-full h-full object-cover">
        <img
          *ngIf="product.images[1]"
          [src]="product.images[1]"
          [alt]="product.name + ' trong không gian thực tế'"
          loading="lazy"
          aria-hidden="true"
          class="pc__photo pc__photo--alt absolute inset-0 w-full h-full object-cover">

        <!-- Badges -->
        <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 items-start">
          <span *ngIf="product.productionType === 'PRINT_ON_DEMAND'" class="pc__tag pc__tag--dark">
            <app-icon name="cube" [size]="11"></app-icon>
            <span>In 3D</span>
          </span>
          <span *ngIf="product.productionType === 'READY_STOCK'" class="pc__tag">Có sẵn</span>
          <span *ngIf="product.customizable" class="pc__tag pc__tag--accent">
            <app-icon name="sliders" [size]="11"></app-icon>
            <span>Tùy biến 3D</span>
          </span>
        </div>

        <!-- Favorite -->
        <button
          type="button"
          (click)="toggleFavorite($event)"
          class="pc__fav absolute top-2.5 right-2.5 z-10 w-8 h-8 rounded-full flex items-center justify-center transition hover:scale-110"
          [class.text-neutral-700]="!favoriteService.isFavorite(product.id)"
          [class.text-rose-500]="favoriteService.isFavorite(product.id)"
          [attr.aria-label]="favoriteService.isFavorite(product.id) ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'"
          [attr.aria-pressed]="favoriteService.isFavorite(product.id)">
          <app-icon
            name="heart"
            [size]="16"
            [filled]="favoriteService.isFavorite(product.id)">
          </app-icon>
        </button>

        <!-- Hover actions -->
        <div class="pc__actions absolute inset-x-0 bottom-0 p-2.5 flex items-center justify-center gap-2">
          <a
            *ngIf="product.customizable"
            [routerLink]="['/customizer-3d']"
            [queryParams]="{ productId: product.id }"
            class="pc__btn pc__btn--solid">
            <app-icon name="sliders" [size]="13"></app-icon>
            <span>Tùy biến 3D</span>
          </a>
          <button type="button" (click)="openQuickView()" class="pc__btn">
            <app-icon name="eye" [size]="13"></app-icon>
            <span>Xem nhanh</span>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div class="pc__body flex-1 flex flex-col min-w-0" [class.pt-3.5]="layout === 'grid'">
        <div class="flex items-center justify-between gap-2 pc__meta">
          <span class="pc__cat truncate">{{ product.categoryName }}</span>
          <span class="pc-rating flex items-center gap-1 flex-shrink-0">
            <app-icon name="star" [size]="11" [filled]="true"></app-icon>
            <span>{{ product.rating }}</span>
            <span class="pc__count">({{ product.reviewCount }})</span>
          </span>
        </div>

        <h3 class="pc__name line-clamp-2">
          <a [routerLink]="['/product', product.slug]">{{ product.name }}</a>
        </h3>

        <p class="pc__dim line-clamp-1">{{ product.dimensions }}</p>

        <div class="pc__foot mt-auto flex items-end justify-between gap-2">
          <div class="flex items-baseline flex-wrap gap-x-2">
            <span class="pc__price">{{ product.basePrice | vnd }}</span>
            <span *ngIf="product.originalPrice" class="pc__old">{{ product.originalPrice | vnd }}</span>
          </div>

          <button
            *ngIf="!product.customizable"
            type="button"
            (click)="quickAddToCart()"
            class="pc__cart"
            title="Thêm vào giỏ hàng"
            aria-label="Thêm vào giỏ hàng">
            <app-icon name="cart" [size]="16"></app-icon>
          </button>

          <a
            *ngIf="product.customizable"
            [routerLink]="['/customizer-3d']"
            [queryParams]="{ productId: product.id }"
            class="pc__custom"
            title="Tùy biến 3D">
            <span>Tùy biến</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>

    </div>
