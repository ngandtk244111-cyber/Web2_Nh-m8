<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" *ngIf="styleTiles().length > 0">
  <header class="fb-head">
    <p class="fb-eyebrow">Được khách hàng Luméa chọn nhiều nhất</p>
    <h2 class="fb-title">Thương Hiệu Ưa Thích</h2>
  </header>

  <div class="fb-grid">
    <a
      *ngFor="let tile of styleTiles()"
      [routerLink]="['/thuong-hieu', tile.slug]"
      class="fb-tile"
      [attr.aria-label]="'Luméa ' + tile.style + ' — ' + tile.count + ' sản phẩm'">
      <span class="fb-tile__name">Luméa {{ tile.style }}</span>
      <span class="fb-tile__img">
        <img [src]="tile.image" [alt]="'Không gian phong cách ' + tile.style" loading="lazy" draggable="false">
      </span>
    </a>
  </div>
</section>
