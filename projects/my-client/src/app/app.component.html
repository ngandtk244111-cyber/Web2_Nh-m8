<div class="min-h-screen flex flex-col bg-neutral-50 text-neutral-900 selection:bg-amber-500/30 selection:text-amber-900">
  @if (!bare()) {
    <!-- Sticky Global Header -->
    <app-header></app-header>
  }

  <!-- Page Route Content -->
  <main class="flex-1 route-fade" [class.route-fade--leaving]="routeLeaving()">
    <router-outlet></router-outlet>
  </main>

  @if (!bare()) {
    <!-- Global Footer -->
    <app-footer></app-footer>
  }

  <!-- AI Idea Assistant Modal Dialog -->
  <app-ai-modal></app-ai-modal>

  <!-- Login Modal (OTP) -->
  <app-login-modal></app-login-modal>

  @if (!bare()) {
    <!-- Support Chat Widget (realtime) -->
    <app-support-chat-widget></app-support-chat-widget>
  }

  <!-- Product Quick View Modal -->
  <app-product-quick-view></app-product-quick-view>

  <!-- Global Toast Notifications -->
  <app-toast></app-toast>

  <!-- Hộp thoại xác nhận dùng chung (đăng xuất...) -->
  <app-confirm-dialog></app-confirm-dialog>

  @if (!bare()) {
    <!-- Floating Side Banners (desktop only) -->
    <app-floating-side-banners></app-floating-side-banners>

    <!-- Floating Mascot Sticker (desktop only) -->
    <app-floating-mascot></app-floating-mascot>

    <!-- Túi voucher nổi góc màn hình -->
    <app-floating-coin-widget></app-floating-coin-widget>

    <!-- Nút lên đầu trang (góc phải dưới) -->
    <app-scroll-to-top></app-scroll-to-top>
  }
</div>
