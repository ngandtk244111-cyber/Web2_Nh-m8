<section class="pg_section">
  <div class="pg_row">
    <ng-container *ngFor="let banner of squareBanners; let i = index">

      <!-- Thẻ ảnh phủ kín -->
      <a *ngIf="banner.layout === 'photo'" appScrollReveal="rise" [revealDelay]="i * 180" [routerLink]="banner.link" [queryParams]="banner.queryParams" class="pg_card pg_photo">
        <span class="pg_photo__frame" aria-hidden="true">
          <img [src]="banner.image" alt="" class="pg_photo__img" loading="lazy" draggable="false">
        </span>
        <span class="pg_photo__shade" aria-hidden="true"></span>
        <div class="pg_photo__text">
          <h3 class="pg_title">{{ banner.title }}</h3>
          <p class="pg_desc">{{ banner.description }}</p>
          <span class="pg_btn pg_btn--light">{{ banner.ctaLabel }} <app-icon name="chevron-right" [size]="14"></app-icon></span>
        </div>
      </a>

      <!-- Thẻ ưu đãi có mascot -->
      <a *ngIf="banner.layout === 'mascot'" appScrollReveal="rise" [revealDelay]="i * 180" [routerLink]="banner.link" [queryParams]="banner.queryParams" class="pg_card pg_promo">
        <span class="pg_promo__glow" aria-hidden="true"></span>
        <div class="pg_promo__text">
          <span class="pg_eyebrow pg_eyebrow--soft">{{ banner.eyebrow }}</span>
          <h3 class="pg_title pg_title--promo">{{ banner.title }}</h3>
          <p class="pg_desc">{{ banner.description }}</p>
          <span class="pg_ticket" *ngIf="banner.code">
            <app-icon name="tag" [size]="13"></app-icon>
            Mã: <strong>{{ banner.code }}</strong>
          </span>
          <span class="pg_btn pg_btn--light">{{ banner.ctaLabel }} <app-icon name="chevron-right" [size]="14"></app-icon></span>
        </div>
        <div class="pg_promo__mascot">
          <img [src]="banner.image" alt="Goh - mascot Luméa" loading="lazy">
        </div>
      </a>

    </ng-container>
  </div>

  <a appScrollReveal="rise" [routerLink]="wideBanner.link" [queryParams]="wideBanner.queryParams" class="pg_card pg_wide">
    <!-- Video phủ kín toàn banner, chữ đè lên trên -->
    <!-- *ngFor tạo lại thẻ video khi admin đổi nguồn: đổi <source> trên thẻ đã tải không có tác dụng -->
    <video
      *ngFor="let video of [wideBanner.video]"
      class="pg_wide__video"
      aria-hidden="true"
      [autoplay]="true"
      loop
      muted
      playsinline
      preload="metadata">
      <source *ngIf="video.webm" [src]="video.webm" type="video/webm">
      <source [src]="video.mp4" type="video/mp4">
    </video>
    <span class="pg_wide__shade" aria-hidden="true"></span>

    <div class="pg_wide__text">
      <span class="pg_eyebrow">{{ wideBanner.eyebrow }}</span>
      <h3 class="pg_title pg_title--wide">{{ wideBanner.title }}</h3>
      <p class="pg_desc">{{ wideBanner.description }}</p>
      <span class="pg_btn pg_btn--glass">{{ wideBanner.ctaLabel }} <app-icon name="chevron-right" [size]="14"></app-icon></span>
    </div>
  </a>
</section>
