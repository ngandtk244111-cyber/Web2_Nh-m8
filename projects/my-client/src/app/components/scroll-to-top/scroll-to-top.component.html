<button
  type="button"
  class="stt"
  [class.stt--visible]="visible()"
  [class.stt--blink]="blinking()"
  [attr.tabindex]="visible() ? 0 : -1"
  [attr.aria-hidden]="!visible()"
  aria-label="Lên đầu trang"
  title="Lên đầu trang"
  (click)="scrollToTop()">
  <svg class="stt__arrow" viewBox="0 0 24 24" width="22" height="22" fill="none"
       stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5" />
    <path d="M5 12l7-7 7 7" />
  </svg>
</button>
