<!-- Chặn nổi bọt: đổi tháng tạo lại ô ngày nên phần tử vừa bấm có thể đã rời DOM khi kiểm tra bấm ra ngoài -->
<div class="relative inline-block" (click)="$event.stopPropagation()">
  <button
    type="button"
    (click)="toggle()"
    aria-haspopup="true"
    [attr.aria-expanded]="open"
    class="flex items-center gap-2 px-3 py-2 bg-white border border-[#E3D5BA] hover:bg-[#F3ECDD] rounded-lg text-xs font-medium text-[#1F1712] transition whitespace-nowrap">
    <app-icon name="calendar" [size]="14"></app-icon>
    <span>{{ label }}</span>
    <app-icon name="chevron-down" [size]="14"></app-icon>
  </button>

  <div *ngIf="open" class="absolute right-0 top-full mt-2 z-30 bg-white rounded-xl border border-[#E8DEC9] shadow-2xl animate-fade-in">

    <!-- Danh sách khoảng có sẵn -->
    <div *ngIf="view === 'menu'" class="w-44 p-1.5">
      <button
        *ngFor="let preset of presets"
        type="button"
        (click)="choosePreset(preset)"
        class="w-full px-3 py-2 rounded-lg text-left text-xs font-medium transition"
        [ngClass]="range === preset ? 'bg-[#F9F1F2] text-[#A3152D]' : 'text-[#1F1712] hover:bg-[#F3ECDD]'">
        {{ preset }} ngày qua
      </button>
      <button
        type="button"
        (click)="openCalendar()"
        class="w-full px-3 py-2 rounded-lg text-left text-xs font-medium transition"
        [ngClass]="range === 'custom' ? 'bg-[#F9F1F2] text-[#A3152D]' : 'text-[#1F1712] hover:bg-[#F3ECDD]'">
        Tùy chọn
      </button>
    </div>

    <!-- Lịch chọn khoảng ngày -->
    <div *ngIf="view === 'calendar'" class="w-72 max-w-[calc(100vw-48px)] p-4 space-y-3">
      <div class="flex items-center justify-between">
        <button type="button" (click)="shiftMonth(-1)" aria-label="Tháng trước" class="p-1.5 rounded-lg text-[#1F1712] hover:bg-[#F3ECDD] transition">
          <app-icon name="chevron-left" [size]="14"></app-icon>
        </button>
        <span class="text-xs font-semibold text-[#1F1712]">{{ monthLabel }}</span>
        <button type="button" (click)="shiftMonth(1)" [disabled]="!canGoNext" aria-label="Tháng sau" class="p-1.5 rounded-lg text-[#1F1712] hover:bg-[#F3ECDD] disabled:opacity-30 disabled:hover:bg-transparent transition">
          <app-icon name="chevron-right" [size]="14"></app-icon>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-y-1 text-center">
        <span *ngFor="let weekday of weekdays" class="py-1 text-[10px] font-semibold text-[#93877E]">{{ weekday }}</span>
        <span *ngFor="let blank of leadingBlanks"></span>
        <button
          *ngFor="let d of days; trackBy: trackDay"
          type="button"
          (click)="pickDay(d.iso)"
          [disabled]="d.disabled"
          [attr.aria-label]="formatDate(d.iso)"
          [attr.aria-pressed]="d.isEdge"
          class="h-8 text-xs rounded-lg transition disabled:text-[#CFC6BB] disabled:hover:bg-transparent"
          [class.font-bold]="d.isToday"
          [ngClass]="d.isEdge ? 'bg-[#A3152D] text-white' : d.inRange ? 'bg-[#F9F1F2] text-[#A3152D]' : 'text-[#1F1712] hover:bg-[#F3ECDD]'">
          {{ d.day }}
        </button>
      </div>

      <p class="text-[11px] text-[#7A6F67]">
        Từ <span class="font-semibold text-[#1F1712]">{{ formatDate(draftFrom) }}</span>
        đến <span class="font-semibold text-[#1F1712]">{{ formatDate(draftTo) }}</span>
      </p>

      <div class="flex justify-end gap-2">
        <button type="button" (click)="view = 'menu'" class="px-3 py-1.5 border border-[#E3D5BA] rounded-lg text-xs font-medium text-[#1F1712]">Quay lại</button>
        <button type="button" (click)="apply()" [disabled]="!draftFrom || !draftTo" class="px-3 py-1.5 bg-[#A3152D] hover:bg-[#891226] disabled:opacity-50 text-white rounded-lg text-xs font-medium transition">Áp dụng</button>
      </div>
    </div>
  </div>
</div>
