    <div class="relative w-full h-full min-h-[350px] bg-gradient-to-b from-[#FBF7EE] to-[#F6F5F2] rounded-3xl overflow-hidden border border-neutral-200 select-none shadow-inner">
      
      <!-- Canvas Container -->
      <div 
        #canvasContainer 
        class="w-full h-full cursor-grab active:cursor-grabbing"
        [class.pointer-events-none]="hasError">
      </div>

      <!-- Top Tools Bar -->
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none">
        
        <!-- Model Status Badge -->
        <div class="pointer-events-auto bg-[#FFFFFF]/90 backdrop-blur-md px-3 py-1 rounded-xl border border-neutral-200 text-[11px] font-semibold text-neutral-700 shadow-md flex items-center gap-1.5">
          <span 
            class="w-2 h-2 rounded-full"
            [class.bg-amber-400]="!hasError"
            [class.animate-pulse]="!hasError"
            [class.bg-rose-500]="hasError">
          </span>
          <span>{{ hasError ? 'Sự cố hiển thị 3D' : 'Mô Phỏng 3D' }}</span>
        </div>

        <!-- Graphics Quality Tier Selector -->
        <div class="pointer-events-auto flex items-center gap-1 bg-[#FFFFFF]/90 backdrop-blur-md p-1 rounded-xl border border-neutral-200 shadow-md text-[10px]">
          <button 
            type="button"
            *ngFor="let opt of qualityOptions"
            (click)="setQuality(opt.mode)"
            [class]="qualityMode === opt.mode 
              ? 'bg-gradient-to-r from-amber-400 to-amber-600 text-white font-extrabold shadow-xs' 
              : 'text-neutral-600 hover:text-white hover:bg-neutral-200'"
            class="px-2 py-0.5 rounded-lg transition"
            [title]="opt.description">
            {{ opt.label }}
          </button>
        </div>

      </div>

      <!-- Controls Overlay Tools (Bottom) -->
      <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between pointer-events-none">
        
        <!-- Helper instructions -->
        <div class="bg-black/80 backdrop-blur-md text-amber-700 border border-amber-500/20 text-[11px] px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-md">
          <app-icon name="rotate" [size]="14" class="text-amber-400"></app-icon>
          <span class="hidden sm:inline">Kéo chuột để xoay 360° • Cuộn để phóng to</span>
          <span class="sm:hidden">1 ngón xoay • 2 ngón zoom</span>
        </div>

        <!-- Reset Camera button -->
        <button 
          type="button"
          (click)="resetCamera()"
          class="pointer-events-auto bg-[#FFFFFF]/90 hover:bg-[#EDEBE6] text-amber-400 p-2 rounded-full shadow-md transition text-xs flex items-center gap-1 border border-neutral-200 active:scale-95"
          title="Đặt lại góc nhìn chuẩn">
          <app-icon name="rotate" [size]="14"></app-icon>
        </button>

      </div>

      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="absolute inset-0 bg-[#F6F5F2]/85 backdrop-blur-sm flex flex-col items-center justify-center text-amber-400 z-10 transition-opacity duration-200">
        <app-icon name="cube" [size]="32" class="animate-spin mb-2 text-amber-400"></app-icon>
        <span class="text-xs font-semibold text-neutral-700">Đang chuẩn bị mô hình 3D...</span>
      </div>

      <!-- WebGL Failure / Context Lost Fallback Overlay -->
      <div 
        *ngIf="hasError" 
        class="absolute inset-0 bg-[#FFFFFF]/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-amber-950/50 text-white border border-amber-500/30 flex items-center justify-center">
          <app-icon name="cube" [size]="24"></app-icon>
        </div>
        <h4 class="font-serif text-sm font-bold text-amber-800">Không thể tải không gian 3D</h4>
        <p class="text-xs text-neutral-600 max-w-xs leading-relaxed">
          Trình duyệt hoặc card đồ họa tạm thời mất kết nối WebGL. Bạn vẫn có thể xem ảnh thật và tiếp tục đặt hàng bình thường.
        </p>
        <button 
          type="button"
          (click)="retryInit()"
          class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 text-white text-xs font-bold shadow-md transition active:scale-95 flex items-center gap-1.5">
          <app-icon name="rotate" [size]="14"></app-icon>
          <span>Thử lại tải 3D</span>
        </button>
      </div>

    </div>
