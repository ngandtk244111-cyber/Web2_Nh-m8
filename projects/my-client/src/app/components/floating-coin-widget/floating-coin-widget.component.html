<div class="fcw" *ngIf="!dismissed()">
  <button type="button" class="fcw__close" aria-label="Đóng túi voucher" (click)="dismiss($event)">
    <app-icon name="x" [size]="9"></app-icon>
  </button>

  <button type="button" class="fcw__btn" aria-label="Xem voucher của bạn" (click)="toggle()">
    <!-- Hộp quà voucher: hộp hồng mở nắp, tấm voucher "%" bật lên lơ lửng -->
    <svg viewBox="0 0 100 110" class="fcw__bag" aria-hidden="true">
      <defs>
        <linearGradient id="fcw-box" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF8FB1"/>
          <stop offset="1" stop-color="#E5466E"/>
        </linearGradient>
        <linearGradient id="fcw-box-side" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#D93A62"/>
          <stop offset="1" stop-color="#B92A50"/>
        </linearGradient>
        <linearGradient id="fcw-lid" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFA3BF"/>
          <stop offset="1" stop-color="#EE5A80"/>
        </linearGradient>
        <linearGradient id="fcw-ribbon" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE08A"/>
          <stop offset="1" stop-color="#F2B33D"/>
        </linearGradient>
        <linearGradient id="fcw-ticket" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#FFE3EC"/>
        </linearGradient>
        <path id="fcw-star" d="M0-5 1.5-1.5 5 0 1.5 1.5 0 5-1.5 1.5-5 0-1.5-1.5z"/>
      </defs>

      <!-- nắp hộp mở nghiêng -->
      <g transform="translate(2 -2) rotate(-58 20 64)">
        <rect x="14" y="52" width="72" height="13" rx="3" fill="url(#fcw-lid)"/>
        <rect x="45" y="52" width="10" height="13" fill="url(#fcw-ribbon)"/>
        <!-- nơ -->
        <path d="M50 52C42 40 30 44 36 51C39 54 46 53 50 52Z" fill="url(#fcw-ribbon)" stroke="#E2A12E" stroke-width="1"/>
        <path d="M50 52C58 40 70 44 64 51C61 54 54 53 50 52Z" fill="url(#fcw-ribbon)" stroke="#E2A12E" stroke-width="1"/>
        <circle cx="50" cy="52" r="3.4" fill="#F2B33D"/>
      </g>

      <!-- tấm voucher bật ra từ hộp (lơ lửng lên xuống) -->
      <g class="fcw__ticket">
        <g transform="translate(4 -12) rotate(-12 52 44)">
          <path d="M30 30H74V39A5 5 0 0 0 74 49V58H30V49A5 5 0 0 0 30 39Z" fill="url(#fcw-ticket)" stroke="#F06C93" stroke-width="1.4"/>
          <path d="M40 31V57" stroke="#F7A9C0" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
          <circle cx="54" cy="39.5" r="3.2" fill="none" stroke="#E5466E" stroke-width="2.2"/>
          <circle cx="64" cy="49" r="3.2" fill="none" stroke="#E5466E" stroke-width="2.2"/>
          <path d="M66 37 52 51.5" stroke="#E5466E" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- thân hộp -->
      <path d="M20 64H80V98Q80 103 75 103H25Q20 103 20 98Z" fill="url(#fcw-box)"/>
      <path d="M64 64H80V98Q80 103 75 103H64Z" fill="url(#fcw-box-side)" opacity="0.55"/>
      <rect x="45" y="64" width="10" height="39" fill="url(#fcw-ribbon)"/>
      <ellipse cx="28" cy="80" rx="2.4" ry="7" fill="#ffffff" opacity="0.4"/>

      <!-- sao lấp lánh -->
      <g transform="translate(14 40)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0s" fill="#FFE27A"/></g>
      <g transform="translate(88 34)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0.5s" fill="#ffffff"/></g>
      <g transform="translate(26 14)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:1.1s" fill="#ffffff"/></g>
      <g transform="translate(80 12)"><use href="#fcw-star" class="fcw__spark" style="animation-delay:0.8s" fill="#FFE27A"/></g>
      <g transform="translate(52 8)"><use href="#fcw-star" class="fcw__spark fcw__spark--sm" style="animation-delay:1.4s" fill="#FFF1B0"/></g>
    </svg>
    <span class="fcw__badge">
      <app-icon name="tag" [size]="10"></app-icon>
      <span>{{ authService.currentUser() ? voucherService.usable().length : 0 }}</span>
    </span>
  </button>

  <div class="fcw__panel" *ngIf="panelOpen()" (click)="$event.stopPropagation()">
    <div class="fcw__panel-head">
      <span>Voucher của bạn</span>
      <button type="button" class="fcw__panel-close" aria-label="Đóng" (click)="close()">
        <app-icon name="x" [size]="13"></app-icon>
      </button>
    </div>
    <div class="fcw__panel-balance">
      <app-icon name="tag" [size]="20"></app-icon>
      <span>{{ voucherService.usable().length }} voucher</span>
    </div>
    <p class="fcw__panel-hint">Chọn voucher ở giỏ hàng để được giảm giá khi thanh toán.</p>
    <a routerLink="/voucher" (click)="close()" class="fcw__panel-link">
      Lật thẻ, chơi game nhận voucher →
    </a>
  </div>
</div>
