<div
  class="pp_overlay"
  *ngIf="visible()"
  [class.pp_overlay--closing]="closing()"
  (click)="close()">

  <div class="pp_popup" [class.pp_popup--closing]="closing()" (click)="$event.stopPropagation()">
    <button type="button" class="pp_close" (click)="close()" aria-label="Đóng">
      <app-icon name="x" [size]="18"></app-icon>
    </button>

    <a [href]="popup().link" class="pp_link" (click)="openLink($event)" [attr.aria-label]="popup().title">
      <img [src]="popup().imageUrl" [alt]="popup().title" class="pp_image" draggable="false">
    </a>
  </div>
</div>
