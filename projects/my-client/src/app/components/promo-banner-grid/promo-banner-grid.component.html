<section class="pg_section">
  <div class="pg_row">
    <a
      *ngFor="let banner of squareBanners"
      [routerLink]="banner.link"
      class="pg_square"
      [style.background-image]="banner.image ? 'url(' + banner.image + ')' : banner.gradient">
      <div class="pg_square__icon">
        <app-icon [name]="banner.icon" [size]="26"></app-icon>
      </div>
      <span class="pg_eyebrow">{{ banner.eyebrow }}</span>
      <h3 class="pg_title">{{ banner.title }}</h3>
      <p class="pg_desc">{{ banner.description }}</p>
      <span class="pg_cta">{{ banner.ctaLabel }} <app-icon name="chevron-right" [size]="14"></app-icon></span>
    </a>
  </div>

  <a
    [routerLink]="wideBanner.link"
    class="pg_wide"
    [style.background]="wideBanner.gradient">
    <video
      *ngIf="wideBanner.video as video"
      class="pg_wide__video"
      [autoplay]="true"
      loop
      muted
      playsinline
      preload="metadata"
      aria-hidden="true">
      <source *ngIf="video.webm" [src]="video.webm" type="video/webm">
      <source [src]="video.mp4" type="video/mp4">
    </video>
    <span class="pg_wide__overlay" aria-hidden="true"></span>
    <span class="pg_wide__sparkles" aria-hidden="true"></span>
    <span class="pg_wide__shine" aria-hidden="true"></span>

    <span class="pg_wide__badge">
      <app-icon name="sparkles" [size]="11"></app-icon>
      Tính năng mới
    </span>

    <div class="pg_wide__text">
      <span class="pg_eyebrow">{{ wideBanner.eyebrow }}</span>
      <h3 class="pg_title pg_title--wide">{{ wideBanner.title }}</h3>
      <p class="pg_desc">{{ wideBanner.description }}</p>
      <span class="pg_cta pg_cta--wide">{{ wideBanner.ctaLabel }} <app-icon name="chevron-right" [size]="14"></app-icon></span>
    </div>

    <div class="pg_wide__icon">
      <span class="pg_wide__icon-ring"></span>
      <app-icon [name]="wideBanner.icon" [size]="88"></app-icon>
    </div>
  </a>
</section>
