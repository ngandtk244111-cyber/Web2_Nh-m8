<div class="min-h-screen flex items-center justify-center bg-neutral-900 px-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8 space-y-6">

    <div class="flex flex-col items-center gap-2 text-center">
      <div class="w-12 h-12 rounded-xl bg-black flex items-center justify-center overflow-hidden">
        <img src="/logo/lumea-mark.png" alt="Luméa" class="w-full h-full object-contain p-1.5">
      </div>
      <h1 class="font-serif text-lg font-bold text-neutral-900">Luméa Admin Portal</h1>
      <p class="text-xs text-neutral-500">Đăng nhập để vào trang quản trị</p>
    </div>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-neutral-700 mb-1.5">Tên đăng nhập</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          class="w-full text-sm bg-neutral-100 border border-neutral-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-400 text-neutral-800"
          [disabled]="submitting">
      </div>

      <div>
        <label class="block text-xs font-semibold text-neutral-700 mb-1.5">Mật khẩu</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          class="w-full text-sm bg-neutral-100 border border-neutral-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-400 text-neutral-800"
          [disabled]="submitting">
      </div>

      <p *ngIf="error" class="text-xs text-red-600">{{ error }}</p>

      <button
        type="submit"
        [disabled]="!username.trim() || !password.trim() || submitting"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 disabled:opacity-50 text-neutral-950 font-bold text-sm transition">
        {{ submitting ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

  </div>
</div>
