<section class="pc_section">
  <div class="pc_grid" [style.--cols]="posters.length">
    <a
      *ngFor="let p of posters"
      [routerLink]="p.link"
      [queryParams]="p.queryParams"
      class="pc_poster"
      [attr.aria-label]="p.alt">
      <img [src]="p.image" [alt]="p.alt" loading="lazy" draggable="false">
    </a>
  </div>
</section>
