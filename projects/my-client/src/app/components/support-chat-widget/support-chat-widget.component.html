<!-- Floating trigger button -->
<button
  *ngIf="!chatService.isOpen()"
  (click)="toggle()"
  type="button"
  class="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-gradient-to-tr from-amber-400 via-amber-500 to-amber-600 text-white shadow-[0_4px_20px_rgba(205, 129, 142,0.5)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
  <app-icon name="message" [size]="24"></app-icon>
</button>

<!-- Chat panel -->
<div
  *ngIf="chatService.isOpen()"
  class="fixed bottom-5 right-5 z-40 w-[92vw] max-w-sm h-[480px] bg-white rounded-3xl border border-neutral-200 shadow-2xl flex flex-col overflow-hidden">

  <div class="bg-gradient-to-r from-amber-400 to-amber-600 text-white px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <app-icon name="message" [size]="18"></app-icon>
      <span class="font-bold text-sm">Hỗ Trợ Trực Tuyến Luméa</span>
    </div>
    <button (click)="toggle()" class="hover:opacity-70">
      <app-icon name="x" [size]="18"></app-icon>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#F6F5F2]">
    <div *ngIf="chatService.messages().length === 0" class="text-center text-xs text-neutral-500 pt-8">
      Chào bạn! Nhắn tin để được đội ngũ Luméa hỗ trợ trực tiếp.
    </div>

    <div
      *ngFor="let msg of chatService.messages()"
      class="max-w-[80%] px-3.5 py-2 rounded-2xl text-xs"
      [class.ml-auto]="msg.sender === 'customer'"
      [class.bg-amber-400]="msg.sender === 'customer'"
      [class.text-white]="msg.sender === 'customer'"
      [class.bg-white]="msg.sender === 'staff'"
      [class.text-neutral-800]="msg.sender === 'staff'"
      [class.border]="msg.sender === 'staff'"
      [class.border-neutral-200]="msg.sender === 'staff'">
      {{ msg.text }}
    </div>
  </div>

  <form (ngSubmit)="send()" class="p-3 border-t border-neutral-200 flex items-center gap-2 bg-white">
    <input
      type="text"
      [(ngModel)]="draft"
      name="draft"
      placeholder="Nhập tin nhắn..."
      class="flex-1 text-xs p-2.5 rounded-xl border border-neutral-300 focus:outline-none focus:border-amber-400">
    <button type="submit" class="p-2.5 rounded-xl bg-amber-500 text-white hover:bg-amber-400 transition">
      <app-icon name="send" [size]="16"></app-icon>
    </button>
  </form>
</div>
